<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODDESSINBLVCK | Official Links & Archive</title>
  <style>
    /* CSS RESET & VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --card-bg: rgba(22, 22, 22, 0.85);
      --card-hover: rgba(34, 34, 34, 0.95);
      --border-color: rgba(255, 255, 255, 0.15);
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --accent: #ffffff;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Courier New", Courier, monospace;
    }

    body {
      background-image: linear-gradient(rgba(13, 13, 13, 0.82), rgba(13, 13, 13, 0.82)), url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #0d0d0d;
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* CONTAINER */
    .linktree-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER & PROFILE */
    .profile-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .profile-avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      padding: 4px;
      margin: 0 auto 16px auto;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      background-color: #ffffff;
      display: block;
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--accent);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .profile-subtitle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .profile-bio {
      font-size: 0.9rem;
      color: #e0e0e0;
      max-width: 440px;
      margin: 0 auto;
      font-style: italic;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* TAB NAVIGATION */
    .tab-navigation {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 0;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: bold;
    }

    /* CONTENT PANELS */
    .tab-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 14px;
    }

    .tab-panel.active {
      display: flex;
    }

    /* CARD STYLES */
    .card-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      border-radius: 6px;
      color: var(--text-main);
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .card-link:hover {
      background-color: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-arrow {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .card-link:hover .card-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* MEDIA CARD (VIDEOS & BLOGS) */
    .media-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .media-body {
      padding: 16px;
    }

    .media-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #c5a059;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .media-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .media-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .media-btn {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-main);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* FOOTER */
    .footer {
      margin-top: 40px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="linktree-container">

    <header class="profile-section">
